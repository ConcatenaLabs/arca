# The Arca server's configuration (arcad). Every setting, with its default
# where it has one.

# Where the JSON interface listens. A reverse proxy in front terminates TLS
# and serves it under one same-origin path.
listen = "127.0.0.1:3535"

# PostgreSQL. The schema is built on first start.
database = "postgres://arca@127.0.0.1:5432/arca"

# The socket arca-signer listens on; the operator key lives there, not here.
signer_socket = "/run/arca/signer.sock"

# The on-chain wallet's BIP39 mnemonic, alone in a file only the operator can
# read.
wallet_mnemonic_file = "/etc/arca/wallet.mnemonic"

# The multiple of the node's relay floor the wallet pays, in the fee asset it
# names for each transaction.
fee_multiple = 2

# The largest request body read, in bytes.
max_request_bytes = 65536

# How long an authentication challenge is good for.
challenge_ttl_seconds = 120

# How often a round is built while participations wait, in seconds. 0 builds
# none on a timer.
round_interval_seconds = 60

# The exit delay bounds, in 512-second units: [min, max]. The default is the
# specification's 36 to 48 hours, [254, 338].
# exit_delay_units = [254, 338]

# The assets a round's fee is paid in, in order of preference. A round pays in
# the first of its own batches' assets the node accepts for fees, else in the
# first of these it accepts, and never in any other. The served assets, in the
# order listed below, when absent.
# fee_assets = ["<asset id>"]

[node]
# sequentiad, with -txindex and -validateanchor.
rpc_url = "http://127.0.0.1:18884/"
cookie_file = "/var/lib/sequentia/.cookie"
# or: rpc_user = "...", rpc_password = "..."

[finality]
# Certified, and the anchor buried this many Bitcoin blocks.
anchor_depth = 2
# "required" on every chain with a committee.
certification = "required"
poll_interval_ms = 1000
# start_height = 0

[watcher]
# Whether the watcher acts on its own as it follows the chain. An operator
# runs it: without it nothing answers a stale exit, and no batch is swept.
enabled = true
# Unroll a node all of whose owners have released their lowest nodes, and
# reclaim those lowest nodes, so a fully refreshed batch comes back before it
# expires. A node with an owner who has not released is never unrolled.
reclaim_early = true
# The most outputs one sweep takes.
max_sweep_inputs = 50
# How often the watcher's recovery work (claims, offboards, expiry, reclaims)
# runs when no block arrives; stale exits are answered on every pass over the
# chain.
recovery_interval_seconds = 30

[limits]
# The calls anyone may make without proving a key are bounded in what they
# leave behind. Operator nonces and authentication challenges are each handed
# out at most this many per second, with bursts of up to issue_burst; a
# request past that is refused with 429 rate_limited. The limit is the
# server's as a whole, not per client.
issue_per_second = 5
issue_burst = 50
# An operator nonce no board took within this time is deleted, and a board
# naming it is then refused (nonce_unknown). A wallet registers its board
# right after it takes the nonce.
nonce_ttl_seconds = 3600
# A board is registered only once the node takes its transaction. One never
# credited whose transaction is still in no block this long after it was
# registered is dropped: marked lost, and no longer broadcast.
board_unconfirmed_seconds = 21600
# How often expired nonces and used or expired challenges are deleted.
cleanup_interval_seconds = 60

[fees]
# The most a refresh costs, in parts per million of the coin's value: due in
# full for a coin 28 days or more from its first expiry, falling to nothing in
# the free window, the two days before its exit deadline (five to three days
# before the expiry). The server takes no coin past its exit deadline, and a
# participation's forfeits are due within a day of its round being final. A
# coin from boards alone pays the whole of it.
refresh_ppm = 0
# What an offboard costs, in parts per million of what it pays out, on top of
# the margin its on-chain output holds for its unlock.
offboard_ppm = 0
# The most margin a co-signed transfer may leave for its checkpoint's and its
# reassignment's fees, as a multiple of the least it must leave: four times
# the node's floor in an asset the node accepts for fees, one atom in one it
# does not. The watcher pays from a margin only the fee its transaction needs
# and returns the rest to the operator's wallet.
max_margin_multiple = 25

# Each asset served, with the smallest leaf taken, in the asset's atoms. An
# asset served need not be one the node accepts for fees: a batch in such an
# asset carries a reserve of one atom on every node and every entry, and
# whoever unrolls it attaches a fee coin in an accepted asset.
[[assets]]
asset = "<asset id>"
min_leaf = "1000"
