# The Arca server's configuration (arcad). Every setting, with its default
# where it has one.

# Where the JSON interface listens. A reverse proxy in front terminates TLS
# and serves it under one same-origin path.
listen = "127.0.0.1:3535"

# PostgreSQL. The schema is built on first start.
database = "postgres://arca@127.0.0.1:5432/arca"

# The socket arca-signer listens on; the operator key lives there, not here.
signer_socket = "/run/arca/signer.sock"

# The on-chain wallet's BIP39 mnemonic, alone in a file only the operator can
# read.
wallet_mnemonic_file = "/etc/arca/wallet.mnemonic"

# The multiple of the node's relay floor the wallet pays, in the fee asset it
# names for each transaction.
fee_multiple = 2

# The largest request body read, in bytes.
max_request_bytes = 65536

# How long an authentication challenge is good for. A challenge is checked
# by a key kept in the database, drawn once, and is itself stored nowhere.
challenge_ttl_seconds = 120

# How often a round is built while participations wait, in seconds. 0 builds
# none on a timer.
round_interval_seconds = 60

# The exit delay bounds, in 512-second units: [min, max]. The default is the
# specification's 36 to 48 hours, [254, 338].
# exit_delay_units = [254, 338]

# Where the operator's metrics are served (GET /metrics, the text format
# Prometheus reads): the watcher's fee pool, what is outstanding against it,
# and the board forfeits it holds back. For the operator alone: a loopback
# address. None are served when absent.
# metrics_listen = "127.0.0.1:3536"

# The assets a round's fee is paid in, in order of preference. A round carries
# one asset and pays its fee in it when the node accepts it for fees and it is
# listed here, else in the first of these the node accepts, and never in any
# other. The served assets, in the order listed below, when absent.
# fee_assets = ["<asset id>"]

[node]
# sequentiad, with -txindex and -validateanchor.
rpc_url = "http://127.0.0.1:18884/"
cookie_file = "/var/lib/sequentia/.cookie"
# or: rpc_user = "...", rpc_password = "..."

[finality]
# Certified, and the anchor buried this many Bitcoin blocks.
anchor_depth = 2
# "required" on every chain with a committee.
certification = "required"
poll_interval_ms = 1000
# start_height = 0

[watcher]
# Whether the watcher acts on its own as it follows the chain. An operator
# runs it: without it nothing answers a stale exit, and no batch is swept.
enabled = true
# Unroll a node all of whose owners have released their lowest nodes, and
# reclaim those lowest nodes, so a fully refreshed batch comes back before it
# expires. A node with an owner who has not released is never unrolled.
reclaim_early = true
# The most outputs one sweep takes.
max_sweep_inputs = 50
# How often the watcher's recovery work (claims, offboards, expiry, reclaims)
# runs when no block arrives; stale exits are answered on every pass over the
# chain.
recovery_interval_seconds = 30
# The most forfeits one claim takes: every forfeit of a round in a block is
# claimed in one transaction, against one atom of its connector asset.
max_claim_inputs = 200
# How many vbytes of the watcher's own transactions may wait for a block
# before it publishes no new forfeit of a board, and the chain's block
# interval: forfeits go out no faster than they can be claimed within their
# refund delay.
block_share_vbytes = 45000
block_interval_seconds = 60

[limits]
# The calls anyone may make without proving a key are bounded in what they
# leave behind. An operator nonce, the one that writes a row, is handed to
# each source (an IPv4 address, an IPv6 /48) at most source_per_second, with
# bursts of up to source_burst, so that one caller cannot use up what every
# caller needs; and over every source together at most issue_per_second,
# with bursts of up to issue_burst: a high bound on the rows nonces hold (the
# rate times their lifetime), far above what honest callers ask. A request
# past either is refused with 429 rate_limited. A challenge writes no row and
# is not limited.
issue_per_second = 250
issue_burst = 10000
source_per_second = 1
source_burst = 10
# A witness of the signer's record, which reads the record under the signer's
# lock and carries up to 34 of its signatures, has a budget of its own, apart
# from the nonces': at most witness_per_second over every source together,
# with bursts of up to witness_burst, and witness_source_per_second to each
# source, with bursts of up to witness_source_burst. A wallet makes one each
# command. The overall budget stays well under what the signer answers (about
# 2,500 witnesses a second of heads it never saw, on a release build), so
# witnesses leave co-signing its time.
witness_per_second = 250
witness_burst = 1000
witness_source_per_second = 5
witness_source_burst = 60
# The reads that serve a wallet what the server holds for it and what it
# publishes (leaf_data, mailbox_read, tree, rounds, bind_mailbox) have a
# budget of their own: at most read_per_second over every source together,
# with bursts of up to read_burst, and read_source_per_second to each source,
# with bursts of up to read_source_burst. A wallet restored from its mnemonic
# reads a page of its leaves, a page of its mailbox and a tree for each round
# its leaves rest on.
read_per_second = 500
read_burst = 2000
read_source_per_second = 10
read_source_burst = 200
# The reverse proxies in front of the server: a request from one of these
# addresses is counted against the address its X-Forwarded-For names (the
# proxy appends the address that connected to it), any other request against
# the address that connected, whatever it carries.
trusted_proxies = ["127.0.0.1", "::1"]
# An operator nonce no board took within this time is deleted, and a board
# naming it is then refused (nonce_unknown). A wallet registers its board
# right after it takes the nonce.
nonce_ttl_seconds = 3600
# A board is registered only once the node takes its transaction. One never
# credited whose transaction is still in no block this long after it was
# registered is dropped: marked lost, and no longer broadcast.
board_unconfirmed_seconds = 21600
# How often expired nonces are deleted.
cleanup_interval_seconds = 60

[fees]
# The most a refresh costs, in parts per million of the coin's value: due in
# full for a coin 28 days or more from its first expiry, falling to nothing in
# the free window, the two days before its exit deadline (five to three days
# before the expiry). The server takes no coin past its exit deadline, and a
# participation's forfeits are due within a day of its round being final. A
# coin resting on a board counts from the board's service expiry, 28 days
# after the median time of the block that confirms the board, when that
# comes first.
refresh_ppm = 0
# What an offboard costs, in parts per million of what it pays out, on top of
# the margin its on-chain output holds for its unlock.
offboard_ppm = 0
# The most margin a co-signed transfer may leave for its checkpoint's and its
# reassignment's fees, as a multiple of the least it must leave: four times
# the node's floor in an asset the node accepts for fees, one atom in one it
# does not. The watcher pays from a margin only the fee its transaction needs
# and returns the rest to the operator's wallet.
max_margin_multiple = 25

# Each asset served, with the smallest leaf taken, in the asset's atoms. Each
# has its own boards, rounds and pool (the wallet's coins of it); an asset not
# listed is refused at every entry. An asset is added without a restart: list
# it, pay the wallet coins of it, and send arcad SIGHUP. An asset served need
# not be one the node accepts for fees: a batch in such an asset carries a
# reserve of one atom on every node and every entry, whoever unrolls it
# attaches a fee coin in an accepted asset, and its rounds pay their fee from
# the pool of the first of fee_assets the node accepts.
#
# min_leaf is in the asset's atoms; min_leaf_value, in its place, is a value
# in the reference unit, converted at the asset's rate (so it needs a rate
# source).
#
# [assets.rate] names where the asset's rate comes from: "node" (the node's
# own rate for the asset, as -con_any_asset_fees sets it), "file" (path = a
# file holding {"rate": <integer>, "time": <unix seconds>}) or "command"
# (command = [program, arguments…], printing the same). A rate is what 10^8
# atoms of the asset are worth in atoms of the reference unit. It is read at
# the start, at a reload and every 15 seconds, and is good for
# max_age_seconds (an hour by default) from its time; once stale, the server
# takes no new work in the asset (rate_stale) until it reads a fresh one. An
# asset with no rate source prices nothing from a rate.
[[assets]]
asset = "<asset id>"
min_leaf = "1000"
# min_leaf_value = "100000"
# [assets.rate]
# source = "file"
# path = "/var/lib/arca/rates/<asset id>.json"
# max_age_seconds = 3600
