[package]
name = "arca-server"
version = "0.1.0"
license = "MIT"
edition = "2021"
repository = "https://github.com/ConcatenaLabs/arca"
description = "The Arca operator's server on Sequentia: durable state, finality, the on-chain wallet, boards and transfer co-signing"
publish = false

[lib]
name = "server"

[dependencies]
arca-covenant = { path = "../covenant" }
arca-sequentia-ext = { path = "../sequentia-ext" }
elements.workspace = true
lwk_signer.workspace = true
lwk_common.workspace = true

thiserror.workspace = true
log.workspace = true
serde = { workspace = true, features = [ "derive" ] }
serde_json.workspace = true
rand = "0.8"
toml.workspace = true
env_logger.workspace = true

tokio = { workspace = true, features = [ "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal" ] }
tokio-postgres = "0.7"
bb8 = "0.9"
bb8-postgres = "0.9"
axum = { version = "0.8", default-features = false, features = [ "http1", "json", "tokio" ] }

[dev-dependencies]
arca-sequentia-ext = { path = "../sequentia-ext", features = [ "regtest" ] }
minreq = "2.14"
tokio = { workspace = true, features = [ "rt-multi-thread", "macros", "sync", "time" ] }
