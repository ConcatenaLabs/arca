name: server

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    name: the operator's server against PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arca
          POSTGRES_PASSWORD: arca
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCA_TEST_POSTGRES: postgres://arca:arca@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked -p arca-server -- --nocapture
