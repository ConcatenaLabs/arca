name: client

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The newest node master commit whose Build-dev workflow passed and
  # published a Linux build, as the node workflow finds it.
  node-build:
    name: find the node build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      run: ${{ steps.node.outputs.run }}
      sha: ${{ steps.node.outputs.sha }}
    steps:
      - name: Find the node build
        id: node
        run: |
          # GitHub's listing of runs now and then answers with none at all
          # (total_count 0), which a workflow with builds never has: asked
          # again until it lists one.
          run=""
          for i in $(seq 1 10); do
            run=$(gh api "repos/ConcatenaLabs/Sequentia/actions/workflows/build-dev.yml/runs?branch=master&status=success&per_page=1" \
              --jq 'select(.total_count > 0) | .workflow_runs[0] | {databaseId: .id, headSha: .head_sha}' || true)
            [ -n "$run" ] && break
            echo "GitHub listed no successful node build (try $i of 10); asking again"
            sleep 6
          done
          if [ -z "$run" ] || [ "$(jq -r .databaseId <<<"$run")" = null ]; then
            echo "no successful node build on master"; exit 1
          fi
          echo "run=$(jq -r .databaseId <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headSha <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "node build: run $(jq -r .databaseId <<<"$run"), commit $(jq -r .headSha <<<"$run")"

  client-tests:
    name: the arca wallet against a whole server, PostgreSQL and the node
    needs: node-build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arca
          POSTGRES_PASSWORD: arca
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCA_TEST_POSTGRES: postgres://arca:arca@127.0.0.1:5432/postgres
      GH_TOKEN: ${{ github.token }}
      # Twenty-odd scenario binaries, each linking the whole wallet and
      # server: with debug info they fill the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      # The runner's preinstalled toolchains this job never uses.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Bark's gRPC protocol, which the Bitcoin side of the wallet speaks, is
      # compiled from its .proto files.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Download sequentiad
        run: |
          gh run download ${{ needs.node-build.outputs.run }} -R ConcatenaLabs/Sequentia \
            -n sequentia-dev-x86_64-pc-linux-gnu -D "$RUNNER_TEMP/node"
          tar -xf "$RUNNER_TEMP/node/sequentia-dev-linux.tar" -C "$RUNNER_TEMP/node"
          echo "SEQUENTIAD_EXEC=$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" -version | head -1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The wallet's unit tests
        run: cargo test --locked -p arca-wallet --features arca --lib

      # The scenarios run the operator's signer, and its keepers, each as
      # its own process, as the server's own tests do.
      - name: Build the signer and the keeper
        run: cargo build --locked -p arca-server --bin arca-signer --bin arca-keeper

      # The mint limiter's tool, with which the signer signs an
      # issuer-operated asset's mint (tests/arca_issuer.rs), at the
      # sequentia-contracts commit it is pinned to.
      - name: Cache the mint limiter's tool
        uses: actions/cache@v4
        with:
          path: ~/.mint-limiter
          key: mint-limiter-9d3b569a2d36044a37170431c3fab4889032eff0

      - name: The mint limiter's tool
        run: |
          if [ ! -x "$HOME/.mint-limiter/bin/mint-limiter" ]; then
            cargo install --locked --root "$HOME/.mint-limiter" --git https://github.com/ConcatenaLabs/sequentia-contracts \
              --rev 9d3b569a2d36044a37170431c3fab4889032eff0 mint-limiter
          fi
          echo "MINT_LIMITER=$HOME/.mint-limiter/bin/mint-limiter" >> "$GITHUB_ENV"

      - name: Scenarios
        run: cargo test --locked -p arca-cli --test arca_scenarios --test arca_adversity --test arca_restore --test arca_digests --test arca_assets --test arca_bitcoin_side --test arca_program_commands --test arca_quotes --test arca_swap_commands --test arca_claims --test arca_offline_refresh --test arca_issuer --test arca_command_view --test arca_bond --test arca_supervised --test arca_accumulator --test arca_channel --test arca_anchor_depth --test arca_owed --test arca_watchtower --test arca_speed_up --test arca_refresh_withdraw --test arca_no_sweep -- --nocapture

  # The wallet's orders and fills, which the scenarios do not carry, and the
  # server kept running for a browser wallet (tests/arca_operator_for_browsers.rs),
  # started, driven through its control address and told to stop.
  order-tests:
    name: the arca wallet's orders and fills, and the server for browsers
    needs: node-build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arca
          POSTGRES_PASSWORD: arca
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCA_TEST_POSTGRES: postgres://arca:arca@127.0.0.1:5432/postgres
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Download sequentiad
        run: |
          gh run download ${{ needs.node-build.outputs.run }} -R ConcatenaLabs/Sequentia \
            -n sequentia-dev-x86_64-pc-linux-gnu -D "$RUNNER_TEMP/node"
          tar -xf "$RUNNER_TEMP/node/sequentia-dev-linux.tar" -C "$RUNNER_TEMP/node"
          echo "SEQUENTIAD_EXEC=$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the signer and the keeper
        run: cargo build --locked -p arca-server --bin arca-signer --bin arca-keeper

      - name: Orders, fills and offboards
        run: cargo test --locked -p arca-cli --test arca_fills --test arca_orders --test arca_resting --test arca_shared_fills --test arca_offboard -- --nocapture

      - name: The server for browsers
        run: |
          cargo test --locked -p arca-cli --test arca_operator_for_browsers --no-run
          export ARCA_OPERATOR_CONTROL=127.0.0.1:18640
          cargo test --locked -p arca-cli --test arca_operator_for_browsers -- --ignored --nocapture > "$RUNNER_TEMP/browsers.log" 2>&1 &
          pid=$!
          c=http://$ARCA_OPERATOR_CONTROL
          for i in $(seq 120); do curl -sf "$c/state" > "$RUNNER_TEMP/state.json" && break; sleep 2; done
          jq -e '.server and .node_url and .genesis_hash' "$RUNNER_TEMP/state.json"
          tip=$(jq .tip "$RUNNER_TEMP/state.json")
          curl -sf -X POST "$c/produce" -d '{}'
          curl -sf -X POST "$c/bury" -d '{}'
          jq -e '.round == null' <<<"$(curl -sf -X POST "$c/round" -d '{}')"
          jq -e --argjson t "$tip" '.tip > $t' <<<"$(curl -sf "$c/state")"
          curl -sf -X POST "$c/quit" -d '{}'
          wait "$pid" || { tail -n 100 "$RUNNER_TEMP/browsers.log"; exit 1; }
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/browsers.log" || { tail -n 100 "$RUNNER_TEMP/browsers.log"; exit 1; }
