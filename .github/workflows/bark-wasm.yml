name: bark-wasm

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The Bitcoin ark wallet built for a browser's dedicated worker (bark-wasm/, a
  # workspace of its own with its own lockfile): it keeps building for wasm32
  # whatever the wallet gains, and its command set's tests pass natively.
  build:
    name: the Bitcoin ark wallet builds for a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bark-wasm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build
        working-directory: bark-wasm
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Test the command set
        working-directory: bark-wasm
        run: cargo test --locked --features native --lib
