name: bark-wasm

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The Bitcoin ark wallet built for a browser's dedicated worker (bark-wasm/, a
  # workspace of its own with its own lockfile): it keeps building for wasm32
  # whatever the wallet gains, and its command set's tests pass natively.
  build:
    name: the Bitcoin ark wallet builds for a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bark-wasm

      - name: Install build dependencies
        run: |
          # protoc from its own release (the version Ubuntu ships, 3.21.12), checked against its
          # hash: the runners' apt mirror can be unreachable for hours, and only protoc is needed.
          curl -fsSL --retry 5 -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          echo "3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Build
        working-directory: bark-wasm
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Test the command set
        working-directory: bark-wasm
        run: cargo test --locked --features native --lib
