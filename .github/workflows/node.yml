name: node

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Everything in this workflow runs against one node build: the newest node
  # master commit whose Build-dev workflow passed and published a Linux build.
  node-build:
    name: find the node build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      run: ${{ steps.node.outputs.run }}
      sha: ${{ steps.node.outputs.sha }}
    steps:
      - name: Find the node build
        id: node
        run: |
          run=$(gh run list -R ConcatenaLabs/Sequentia --workflow Build-dev --branch master \
            --status success --limit 1 --json databaseId,headSha --jq '.[0]')
          echo "run=$(jq -r .databaseId <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headSha <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "node build: run $(jq -r .databaseId <<<"$run"), commit $(jq -r .headSha <<<"$run")"

  node-tests:
    name: verifier and node client against the node
    needs: node-build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # arca-consensus links the node's consensus library, and both crates'
      # tests run the node itself, so library and binary come from the same
      # commit.
      - name: Download sequentiad
        run: |
          gh run download ${{ needs.node-build.outputs.run }} -R ConcatenaLabs/Sequentia \
            -n sequentia-dev-x86_64-pc-linux-gnu -D "$RUNNER_TEMP/node"
          tar -xf "$RUNNER_TEMP/node/sequentia-dev-linux.tar" -C "$RUNNER_TEMP/node"
          echo "SEQUENTIAD_EXEC=$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" -version | head -1

      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/Sequentia
          ref: ${{ needs.node-build.outputs.sha }}
          path: sequentia

      - name: Cache the consensus library
        id: lib-cache
        uses: actions/cache@v4
        with:
          path: |
            sequentia/src/.libs/libelementsconsensus.a
            sequentia/src/secp256k1/.libs/libsecp256k1.a
            sequentia/src/config/bitcoin-config.h
          key: elementsconsensus-${{ needs.node-build.outputs.sha }}

      # Only the consensus library: no daemon, wallet or tests, so no Boost.
      - name: Build the consensus library
        if: steps.lib-cache.outputs.cache-hit != 'true'
        working-directory: sequentia
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils
          ./autogen.sh
          ./configure --without-daemon --without-utils --disable-wallet --disable-tests \
            --disable-bench --disable-fuzz-binary --with-gui=no --without-miniupnpc \
            --without-natpmp --disable-zmq --with-libs
          make -j"$(nproc)" -C src libelementsconsensus.la

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        env:
          SEQUENTIA_DIR: ${{ github.workspace }}/sequentia
        run: cargo test --locked -p arca-consensus -p arca-sequentia-ext -- --nocapture

  regtest-suite:
    name: regtest suite and golden vectors against the node
    needs: node-build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download sequentiad
        run: |
          gh run download ${{ needs.node-build.outputs.run }} -R ConcatenaLabs/Sequentia \
            -n sequentia-dev-x86_64-pc-linux-gnu -D "$RUNNER_TEMP/node"
          tar -xf "$RUNNER_TEMP/node/sequentia-dev-linux.tar" -C "$RUNNER_TEMP/node"
          echo "SEQUENTIAD_EXEC=$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/node/sequentia-dev-linux/bin/sequentiad" -version | head -1

      # The suite drives the node through the node's own functional test
      # framework, taken from the same commit as the binary.
      - uses: actions/checkout@v4
        with:
          repository: ConcatenaLabs/Sequentia
          ref: ${{ needs.node-build.outputs.sha }}
          path: sequentia
          sparse-checkout: test/functional

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Golden vectors regenerate byte for byte
        env:
          SEQUENTIA_DIR: ${{ github.workspace }}/sequentia
        run: regtest/vectors.py --check

      - name: Regtest suite
        env:
          SEQUENTIA_DIR: ${{ github.workspace }}/sequentia
        run: regtest/run -j 4

      - name: Keep the logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-suite
          path: |
            regtest/out/logs
            regtest/out/results
          if-no-files-found: ignore
