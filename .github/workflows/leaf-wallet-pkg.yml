name: leaf-wallet-pkg

on:
  push:
    branches: [master]
    paths: ["wallet-wasm/**", "bark/**", "lib/**", "covenant/**", "sequentia-ext/**", "bark-common/**", "bark-runtime/**", ".github/workflows/leaf-wallet-pkg.yml"]
  workflow_dispatch:

jobs:
  # The leaf wallet package (wallet-wasm/ through wasm-pack, `--target web`), as the web wallet's
  # tooling/build-leaf-wallet.sh builds it: every build-machine path remapped, and refused if the
  # package still names one. Kept as an artifact, so the package a wallet carries in leaves/pkg can
  # be taken from here instead of built on a laptop.
  pkg:
    name: the leaf wallet package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet-wasm

      - name: Install build dependencies
        run: |
          # protoc from its own release (the version Ubuntu ships, 3.21.12), checked against its
          # hash: the runners' apt mirror can be unreachable for hours, and only protoc is needed.
          curl -fsSL --retry 5 -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          echo "3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version
          cargo install --locked wasm-pack --version 0.13.1

      - name: Build
        run: |
          src="$GITHUB_WORKSPACE"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          flags=(
            "--cfg" "getrandom_backend=\"wasm_js\""
            "--remap-path-prefix=$src=/arca"
            "--remap-path-prefix=$cargo_home/registry/src=/cargo/registry"
            "--remap-path-prefix=$cargo_home/git/checkouts=/cargo/git"
            "--remap-path-prefix=$rustup_home=/rustup"
          )
          export CARGO_ENCODED_RUSTFLAGS="$(IFS=$'\x1f'; echo "${flags[*]}")"
          cd wallet-wasm
          wasm-pack build --target web --release --out-name leaf_wallet
          # The test-only hook (arca-wallet's `shape-probe` feature) is never
          # in the package: its argument's name is in no other code.
          if grep -a -q -F "shape_off_by" pkg/leaf_wallet_bg.wasm; then
            echo "pkg/leaf_wallet_bg.wasm carries the shape-probe feature" >&2
            exit 1
          fi
          for p in "$HOME" "$src" "$cargo_home"; do
            if grep -a -q -F "$p" pkg/leaf_wallet_bg.wasm; then
              echo "pkg/leaf_wallet_bg.wasm still contains $p" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/leaf-wallet-pkg"
          cp pkg/leaf_wallet.js pkg/leaf_wallet.d.ts pkg/leaf_wallet_bg.wasm "$RUNNER_TEMP/leaf-wallet-pkg/"
          ( cd "$RUNNER_TEMP/leaf-wallet-pkg" && sha256sum leaf_wallet.js leaf_wallet.d.ts leaf_wallet_bg.wasm > SHA256SUMS && echo "$GITHUB_SHA" > BUILT_FROM )
          cat "$RUNNER_TEMP/leaf-wallet-pkg/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: leaf-wallet-pkg-${{ github.sha }}
          path: ${{ runner.temp }}/leaf-wallet-pkg/
          retention-days: 90
