[package]
name = "arca-cli"
version = "0.7.1"
edition = "2024"
license = "MIT"
description = "CLI for the bitcoin Ark protocol built by Second"
authors = [ "Team Second <hello@second.tech>" ]

[lib]
name = "bark_cli"

[[bin]]
name = "bark"
path = "src/bin/bark/main.rs"

[[bin]]
name = "arca"
path = "src/bin/arca/main.rs"

[[bin]]
name = "barkd"
path = "src/bin/barkd/main.rs"

[features]
default = ["tls-native-roots", "barkd-swagger-ui"]

# TLS certificate verification options (pick one)
tls-native-roots = ["arca-wallet/tls-native-roots", "arca-server-rpc/tls-native-roots"]
# Use this feature for cross-compilation. It uses rustls with bundled Mozilla
# CA certificates instead of the system's native TLS and certificate store.
tls-webpki-roots = ["arca-wallet/tls-webpki-roots", "arca-server-rpc/tls-webpki-roots"]
# Compile SQLite from source instead of linking against the system library; useful for cross-compilation.
sqlite-bundled = ["arca-wallet/sqlite-bundled"]

barkd-swagger-ui = ["arca-rest/swagger-ui"]

[dependencies]
arca-lib = { version = "0.7.1", path = "../lib" }
arca-json = { version = "0.7.1", path = "../bark-json" }
arca-wallet = { version = "0.7.1", path = "../bark", default-features = false, features = [ "onchain-bdk", "sqlite", "filestore", "socks5-proxy", "rand", "native", "bitcoind-rpc", "arca" ] }
arca-bitcoin-ext = { version = "0.7.1", path = "../bitcoin-ext", features = ["rpc-socks5-proxy"] }
arca-server-rpc = { version = "0.7.1", path = "../server-rpc", default-features = false, features = ["tonic-native", "socks5-proxy"] }
arca-rest = { version = "0.7.1", path = "../bark-rest", default-features = false }

anyhow.workspace = true
bitcoin.workspace = true
bip39.workspace = true
clap.workspace = true
chrono.workspace = true
lazy_static.workspace = true
env_logger.workspace = true
lightning.workspace = true
lightning-invoice.workspace = true
lnurl-rs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tonic.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "signal", "rt-multi-thread"] }
tokio-util.workspace = true

dialoguer = "0.12"
home = "=0.5.9"


# The scenario tests run the `arca` binary against a whole Arca server on an
# anchored proof-of-stake regtest chain (`tests/arca_scenarios.rs`).
[dev-dependencies]
arca-server = { path = "../server" }
arca-covenant = { path = "../covenant" }
arca-sequentia-ext = { path = "../sequentia-ext", features = [ "regtest" ] }
elements.workspace = true
tokio-postgres = "0.7"
minreq = "2.14"
tokio = { workspace = true, features = [ "time" ] }
