[package]
name = "arca-fuzz"
version = "0.0.1"
publish = false
edition = "2024"
license = "MIT"

[lib]
name = "bark_fuzz"

[dependencies]
honggfuzz = { version = "0.5.55" , default-features = false }
ark = { package = "arca-lib", path = "../lib", features = ["test-util"] }
bitcoin = { version = "0.32", default-features = false, features = ["std"]}
arca-covenant = { path = "../covenant" }
libfuzzer-sys = { version = "0.4", optional = true }

[features]
# The covenant targets under libFuzzer, for machines without honggfuzz.
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "covenant_libfuzzer"
path = "libfuzzer/covenant.rs"
required-features = ["libfuzzer"]

[profile.release]
debug = 1
opt-level = 3
# Catch first-party integer overflow and debug_assert! violations a plain
# release build would wrap/strip. (No memory sanitizers: ark-lib is safe Rust.)
overflow-checks = true
debug-assertions = true

# Use independent workspace for fuzzers
[workspace]
members = ["."]
