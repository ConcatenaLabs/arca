[package]
name = "arca-sequentia-ext"
version = "0.1.0"
license = "MIT"
edition = "2021"
repository = "https://github.com/ConcatenaLabs/arca"
description = "Sequentia chain types and a JSON-RPC client for sequentiad"
publish = false

[lib]
name = "sequentia_ext"

[features]
default = ["minreq"]
# A throwaway anchored regtest chain for tests (`regtest::Regtest`).
regtest = []
# The node client speaks HTTP with `minreq`. Without it, as in a browser, every
# request goes through the transport a program registers (`platform`).
minreq = ["dep:minreq"]

[dependencies]
elements = { workspace = true, features = [ "serde" ] }
base64 = "0.22"
minreq = { version = "2.14", optional = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
arca-sequentia-ext = { path = ".", features = [ "regtest" ] }
